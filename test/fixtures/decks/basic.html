<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Basic deck</title>
<style>
  html, body { margin: 0; }
  .slide { box-sizing: border-box; width: 100vw; height: 100vh; padding: 6vw; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<section class="slide">
  <h1>Basic deck</h1>
  <p>The first slide.</p>
</section>
<section class="slide">
  <h2>Things to say</h2>
  <ul>
    <li>First thing</li>
    <li>Second thing</li>
  </ul>
</section>
<section class="slide">
  <h2>The end</h2>
  <blockquote>Thanks for watching.</blockquote>
</section>
</body>
</html>
